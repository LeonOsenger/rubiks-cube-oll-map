[project]
name = "rubiks-cube-oll-map"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.19",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
